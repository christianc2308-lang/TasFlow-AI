<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba n8n · TaskFlow AI</title>
  <style>
    :root {
      --fondo: #f4f6fb;
      --tarjeta: #ffffff;
      --texto: #1f2430;
      --suave: #667085;
      --borde: #d9dee8;
      --primario: #4f46e5;
      --primario-hover: #4338ca;
      --ok-fondo: #ecfdf3;
      --ok-texto: #067647;
      --error-fondo: #fef3f2;
      --error-texto: #b42318;
      --codigo: #0f172a;
      --codigo-texto: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #0f1117;
        --tarjeta: #181b24;
        --texto: #e6e8ee;
        --suave: #98a2b3;
        --borde: #2c3140;
        --ok-fondo: #0b2a1c;
        --ok-texto: #6ce9a6;
        --error-fondo: #2d1210;
        --error-texto: #fda29b;
        --codigo: #0b0d12;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      padding: 32px 16px;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .subtitulo { color: var(--suave); margin: 0 0 24px; }
    .tarjeta {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--tarjeta);
      color: var(--texto);
      margin-bottom: 16px;
    }
    input:focus, select:focus { outline: 2px solid var(--primario); outline-offset: 1px; }
    .url { font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--primario);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--primario-hover); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .estado {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .estado.ok { display: block; background: var(--ok-fondo); color: var(--ok-texto); }
    .estado.error { display: block; background: var(--error-fondo); color: var(--error-texto); }
    pre {
      margin: 0;
      padding: 14px;
      border-radius: 8px;
      background: var(--codigo);
      color: var(--codigo-texto);
      font-size: 0.85rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    h2 { font-size: 1rem; margin: 0 0 12px; }
    .ayuda { color: var(--suave); font-size: 0.85rem; margin: -8px 0 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Prueba del webhook de n8n</h1>
    <p class="subtitulo">Envía una tarea de prueba al workflow «TaskFlow - Nueva tarea».</p>

    <form id="formulario" class="tarjeta" novalidate>
      <label for="titulo">Título de la tarea</label>
      <input id="titulo" type="text" value="Lanzar página de contacto" required maxlength="200">

      <label for="prioridad">Prioridad</label>
      <select id="prioridad">
        <option value="baja">🟢 Baja</option>
        <option value="media">🟡 Media</option>
        <option value="alta" selected>🟠 Alta</option>
        <option value="urgente">🔴 Urgente</option>
      </select>

      <label for="url">URL del webhook</label>
      <input id="url" class="url" type="url" value="http://localhost:5678/webhook/nueva-tarea">
      <p class="ayuda">Usa <code>/webhook-test/</code> solo tras pulsar «Listen for test event» en n8n.</p>

      <button id="enviar" type="submit">Enviar a n8n</button>
    </form>

    <section class="tarjeta">
      <h2>Resultado</h2>
      <div id="estado" class="estado" role="status"></div>
      <pre id="respuesta">Todavía no se ha enviado nada.</pre>
    </section>
  </main>

  <script type="module">
    // Reutiliza el mismo servicio que la app (servido desde /js/ por tools/servidor.mjs).
    import { enviarAN8n } from "/js/servicios/n8n.js";

    const formulario = document.getElementById("formulario");
    const boton = document.getElementById("enviar");
    const estado = document.getElementById("estado");
    const salida = document.getElementById("respuesta");

    function mostrarEstado(tipo, texto) {
      estado.className = `estado ${tipo}`;
      estado.textContent = texto;
    }

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const titulo = document.getElementById("titulo").value.trim();
      const prioridad = document.getElementById("prioridad").value;
      const url = document.getElementById("url").value.trim();

      if (!titulo) {
        mostrarEstado("error", "El título es obligatorio.");
        return;
      }

      boton.disabled = true;
      boton.textContent = "Enviando…";
      salida.textContent = "Esperando respuesta de n8n…";
      estado.className = "estado";

      try {
        const datos = await enviarAN8n({ titulo, prioridad }, url);
        mostrarEstado("ok", `✅ ${datos.mensaje ?? "Enviado correctamente"}`);
        salida.textContent = JSON.stringify(datos, null, 2);
      } catch (error) {
        const sinConexion = error instanceof TypeError;
        mostrarEstado(
          "error",
          sinConexion
            ? "❌ No se pudo conectar con n8n. ¿Está arrancado y el workflow publicado?"
            : `❌ ${error.message}`
        );
        salida.textContent = error.message;
      } finally {
        boton.disabled = false;
        boton.textContent = "Enviar a n8n";
      }
    });
  </script>
</body>
</html>
