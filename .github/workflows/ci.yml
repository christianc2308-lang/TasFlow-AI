# Comprueba el proyecto en cada push y en cada Pull Request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sintaxis de todos los archivos JavaScript
        run: npm run check

      - name: Pruebas automáticas
        run: npm test
